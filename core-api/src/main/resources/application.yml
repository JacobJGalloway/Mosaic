spring:
  application:
    name: core-api
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: mosaic
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: core-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

mosaic:
  auth:
    # HMAC signing key for JWTs (jjwt). Dev default below is NOT for
    # production use — override via MOSAIC_JWT_SECRET before any real
    # deployment. Must be at least 32 bytes for HS256.
    jwt-secret: ${MOSAIC_JWT_SECRET:dev-only-secret-change-me-before-any-real-deployment-32bytes}
