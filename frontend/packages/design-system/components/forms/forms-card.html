<!-- @dsCard group="Components" viewport="700x420" subtitle="Button, Input, Select, Checkbox, Radio, Switch" name="Forms" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--label-default);display:flex;flex-direction:column;gap:18px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{font:600 15px var(--font-sans);padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer}
  input[type=text],input[type=email],select{font:15px var(--font-sans);padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-input);background:var(--surface);color:var(--label-default)}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
  .inline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400}
</style></head>
<body>
  <div class="row">
    <button style="background:var(--accent-fill);color:var(--label-on-accent-fill);border-color:var(--accent-fill)">Start Onboarding</button>
    <button style="background:var(--surface);color:var(--label-default);border-color:var(--border-input)">Cancel</button>
    <button style="background:transparent;color:var(--accent-text)">View Details</button>
    <button style="background:var(--danger-text);color:var(--label-on-accent-fill);border-color:var(--danger-text)">Deny Claim</button>
  </div>
  <div class="row">
    <label class="f">Policyholder Name<input type="text" placeholder="Jane Alvarez"></label>
    <label class="f">Line of Business<select><option>Auto</option><option>Home</option></select></label>
  </div>
  <div class="row">
    <label class="inline"><input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--accent-fill)">Also holds a home policy</label>
    <span class="inline"><input type="radio" checked style="accent-color:var(--accent-fill)"> Standard&nbsp;&nbsp;<input type="radio" style="accent-color:var(--accent-fill)"> Full</span>
    <span style="width:36px;height:20px;border-radius:999px;background:var(--accent-fill);position:relative;display:inline-block"><span style="position:absolute;top:2px;left:18px;width:16px;height:16px;border-radius:50%;background:var(--neutral-0)"></span></span>
  </div>
</body></html>
