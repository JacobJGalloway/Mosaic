<!-- @dsCard group="Colors" viewport="700x220" subtitle="Single-hue emerald ramp, 50–950" name="Brand Ramp" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:72px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
  .sw span{font-family:var(--font-mono);font-size:10px;color:rgba(0,0,0,.55)}
  .sw.dark span{color:rgba(255,255,255,.75)}
  .label{font-size:11px;color:var(--label-muted);margin-top:8px;font-family:var(--font-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--emerald-50)"><span>50</span></div>
    <div class="sw" style="background:var(--emerald-100)"><span>100</span></div>
    <div class="sw" style="background:var(--emerald-200)"><span>200</span></div>
    <div class="sw" style="background:var(--emerald-300)"><span>300</span></div>
    <div class="sw" style="background:var(--emerald-400)"><span>400</span></div>
    <div class="sw dark" style="background:var(--emerald-500)"><span>500</span></div>
    <div class="sw dark" style="background:var(--emerald-600)"><span>600</span></div>
    <div class="sw dark" style="background:var(--emerald-700)"><span>700</span></div>
    <div class="sw dark" style="background:var(--emerald-800)"><span>800</span></div>
    <div class="sw dark" style="background:var(--emerald-900)"><span>900</span></div>
    <div class="sw dark" style="background:var(--emerald-950)"><span>950</span></div>
  </div>
  <div class="label">hue 158 fixed · lightness 0.97 → 0.195 · chroma peaks mid-ramp</div>
</body></html>
