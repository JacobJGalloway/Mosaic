<!-- @dsCard group="Mosaic App" viewport="1180x720" subtitle="Dashboard, onboarding wizard, customer detail — click through" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mosaic — UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); min-height: 100vh; font-family: var(--font-sans); }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./kit-shared.jsx"></script>
<script type="text/babel" src="./Overview.jsx"></script>
<script type="text/babel" src="./Dashboard.jsx"></script>
<script type="text/babel" src="./OnboardingWizard.jsx"></script>
<script type="text/babel" src="./CustomerDetail.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { Overview, Dashboard, OnboardingWizard, CustomerDetail, ThemeToggle } = window.MosaicKit;

function App() {
  const [screen, setScreen] = useState("overview");
  const [customer, setCustomer] = useState(null);
  const [dark, setDark] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }, [dark]);

  function navigate(key) {
    setScreen(key);
  }
  function openCustomer(c) {
    setCustomer(c);
    setScreen("detail");
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: "100vh" }}>
      <div style={{ display: "flex", justifyContent: "flex-end", padding: "10px 20px", borderBottom: "1px solid var(--border)", background: "var(--surface)" }}>
        <ThemeToggle dark={dark} onChange={setDark} />
      </div>
      <div style={{ flex: 1 }}>
        {screen === "overview" && <Overview onNavigate={navigate} />}
        {screen === "customers" && <Dashboard onNavigate={navigate} onOpenCustomer={openCustomer} />}
        {screen === "onboarding" && <OnboardingWizard onNavigate={navigate} onFinalize={() => navigate("customers")} />}
        {screen === "detail" && customer && <CustomerDetail customer={customer} onNavigate={navigate} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
