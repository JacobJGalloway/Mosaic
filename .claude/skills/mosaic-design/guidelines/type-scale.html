<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);color:var(--label-default)}
  .row{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px dashed var(--border)}
  .row:last-child{border:0}
  .tok{width:64px;font-family:var(--font-mono);font-size:11px;color:var(--label-muted);flex-shrink:0}
</style></head>
<body>
  <div class="row"><span class="tok">3xl/39</span><span style="font-size:39px;font-weight:600">Customer onboarding</span></div>
  <div class="row"><span class="tok">2xl/31</span><span style="font-size:31px;font-weight:600">Customer onboarding</span></div>
  <div class="row"><span class="tok">xl/25</span><span style="font-size:25px;font-weight:600">Customer onboarding</span></div>
  <div class="row"><span class="tok">lg/20</span><span style="font-size:20px;font-weight:500">Policy summary</span></div>
  <div class="row"><span class="tok">md/17</span><span style="font-size:17px;font-weight:500">Claims history</span></div>
  <div class="row"><span class="tok">base/15</span><span style="font-size:15px">Body text sits at 15px, 1.5 line-height.</span></div>
  <div class="row"><span class="tok">sm/13</span><span style="font-size:13px;color:var(--label-muted)">Secondary / table cell</span></div>
  <div class="row"><span class="tok">xs/12</span><span style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-muted)">Eyebrow label</span></div>
</body></html>
