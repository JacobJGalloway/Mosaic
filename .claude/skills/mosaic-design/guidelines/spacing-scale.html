<!-- @dsCard group="Spacing" viewport="700x200" subtitle="4px base grid, 0–96" name="Spacing Scale" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-mono);font-size:11px;color:var(--label-muted)}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .bar{background:var(--accent-graphic);height:10px;border-radius:2px}
  .tok{width:42px}
</style></head>
<body>
  <div class="row"><span class="tok">4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tok">8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok">12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="tok">16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok">24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok">32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tok">48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok">64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="tok">96</span><div class="bar" style="width:96px"></div></div>
</body></html>
