<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Radius + shadow — translucent black, no color tint" name="Radii & Shadows" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans);display:flex;gap:16px}
  .box{width:80px;height:80px;background:var(--surface);display:flex;align-items:flex-end;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--label-muted);padding-bottom:6px;border:1px solid var(--border)}
</style></head>
<body>
  <div class="box" style="border-radius:var(--radius-sm)">sm 6</div>
  <div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-sm)">md 8</div>
  <div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-md)">lg 12</div>
  <div class="box" style="border-radius:var(--radius-pill);box-shadow:var(--shadow-lg)">pill</div>
</body></html>
