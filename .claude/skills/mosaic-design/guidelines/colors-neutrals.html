<!-- @dsCard group="Colors" viewport="700x220" subtitle="Emerald-tinted grays for bg/surface" name="Neutrals" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);font-family:var(--font-sans)}
  .row{display:flex;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:72px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;border-right:1px solid rgba(0,0,0,.05)}
  .sw span{font-family:var(--font-mono);font-size:10px;color:rgba(0,0,0,.5)}
  .sw.dark span{color:rgba(255,255,255,.7)}
  .label{font-size:11px;color:var(--label-muted);margin-top:8px;font-family:var(--font-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--neutral-0)"><span>0</span></div>
    <div class="sw" style="background:var(--neutral-50)"><span>50</span></div>
    <div class="sw" style="background:var(--neutral-100)"><span>100</span></div>
    <div class="sw" style="background:var(--neutral-200)"><span>200</span></div>
    <div class="sw" style="background:var(--neutral-300)"><span>300</span></div>
    <div class="sw" style="background:var(--neutral-400)"><span>400</span></div>
    <div class="sw dark" style="background:var(--neutral-500)"><span>500</span></div>
    <div class="sw dark" style="background:var(--neutral-600)"><span>600</span></div>
    <div class="sw dark" style="background:var(--neutral-700)"><span>700</span></div>
    <div class="sw dark" style="background:var(--neutral-800)"><span>800</span></div>
    <div class="sw dark" style="background:var(--neutral-900)"><span>900</span></div>
    <div class="sw dark" style="background:var(--neutral-950)"><span>950</span></div>
  </div>
  <div class="label">chroma 0.003–0.012, hue 158 — same hue as brand, nearly gray</div>
</body></html>
